name: Build threadschedd

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "applist.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "native/**"
      - "applist.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "29"
  NDK_VERSION: "26.3.11579264"

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          cmake -S native -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build threadschedd
        run: cmake --build build --target threadschedd --parallel

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/threadschedd dist/threadschedd-arm64-v8a
          sha256sum dist/threadschedd-arm64-v8a > dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: threadschedd-android-arm64
          path: dist/
          if-no-files-found: error
